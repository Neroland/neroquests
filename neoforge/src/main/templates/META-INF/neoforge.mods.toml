modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Neroland/neroquests/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
displayURL = "https://neroland.co.za"
description = '''
Data-driven quests for the Neroland ecosystem: a quest book, a three-chapter story line, objectives and rewards written as datapack JSON, daily contracts, and optional NeroEconomy payouts. Requires Neroland Core.
'''

[[mixins]]
config = "neroquests-common.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Neroland Core — required shared foundation; must load BEFORE NeroQuests (ordering = AFTER).
[[dependencies.${mod_id}]]
modId = "nerolandcore"
type = "required"
versionRange = "${nerolandcore_version_range}"
ordering = "AFTER"
side = "BOTH"

# NeroEconomy — OPTIONAL. Budgeted quest payouts and the economy objective light up only when it is
# installed; NeroQuests loads and runs without it. API version 1 shipped in 0.3.0-beta.1.
[[dependencies.${mod_id}]]
modId = "neroeconomy"
type = "optional"
versionRange = "[0.3.0-beta.1,)"
ordering = "AFTER"
side = "BOTH"
