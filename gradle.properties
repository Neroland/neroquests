neo_version_26.3=26.3.0.76

## MinecraftForge / Forge userdev — the `forge` module
forge_version_1.21.1=1.21.1-52.1.20
forge_version_1.21.4=1.21.4-54.1.22
forge_version_1.21.5=1.21.5-55.1.18
